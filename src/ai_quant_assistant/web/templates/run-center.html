<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>回测中心 · 澄明</title><link rel="stylesheet" href="/assets/workbench.css?v={{ asset_version }}"></head>
<body data-page="backtests">{% include "app-nav.html" %}<main>
<div class="page-heading"><p class="eyebrow">RESEARCH · RUNS · EVIDENCE</p><h1 id="center-title">回测中心</h1><p>按研究类型配置，按运行身份回看。事件窗口收益与组合回测分别展示。</p></div>
<nav class="section-links" aria-label="回测中心导航"><a href="/backtests">全部历史</a><a href="/backtests/new">财务因子回测</a><a href="/backtests/factors">因子实验</a><a href="/backtests/screen">条件选股</a><a href="/research/copilot">中报事件研究（研究计划）</a><a href="/data#data-explorer">公告事件研究（原文审核）</a></nav>
<p id="center-error" class="negative" role="alert"></p>
<section id="center-history" class="panel">
<h2>研究与回测历史</h2>
<form id="center-filters" class="center-filters"><label>类型<select id="center-kind"><option value="">全部类型</option>{% for key,value in kinds.items() %}<option value="{{ key }}">{{ value[0] }}</option>{% endfor %}</select></label><label>状态<select id="center-status"><option value="">全部状态</option><option value="queued">等待执行</option><option value="running">运行中</option><option value="succeeded">成功</option><option value="partial">部分成功</option><option value="failed">失败</option><option value="unknown">未知</option></select></label><button type="submit">筛选 / 刷新</button></form>
<p id="center-notice" class="muted"></p><div id="center-list" class="table-shell" aria-live="polite">正在读取…</div><div class="center-pages"><button id="center-prev" type="button">上一页</button><span id="center-page"></span><button id="center-next" type="button">下一页</button></div>
</section>
<section id="center-detail" class="panel" hidden><h2>运行详情</h2><div id="center-identity"></div><p id="center-meaning" class="page-notice"></p><div id="center-detail-actions" class="center-actions"></div><h3>已保存的结果</h3><div id="center-result"></div><details><summary>参数与原始结果</summary><pre id="center-raw"></pre></details></section>
<section id="center-configure" class="panel" hidden><h2 id="center-configure-title">复制参数</h2><p id="center-copy-source"></p><p id="center-copy-warning" class="page-notice"></p><form id="center-copy-form"><div id="center-common-fields" class="center-params"></div><details><summary>高级参数（沿用原运行）</summary><div id="center-advanced-fields" class="center-params"></div></details><label><input id="center-missing-confirm" type="checkbox"> 我已核对原记录缺失参数的补充值</label><div class="center-actions"><button id="center-preflight" type="button">研究数据预检</button><button id="center-submit" type="submit" disabled>确认并提交新运行</button></div></form><div id="center-preflight-result"></div><p id="center-submit-result" role="status"></p><a href="/data#research-data-panel">查看既有补齐计划；补齐与研究执行分别确认</a></section>
</main><script src="/assets/run-center.js?v={{ asset_version }}" defer></script></body></html>
