<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>指数基金规模观察 · 澄明</title>
  <link rel="stylesheet" href="/assets/workbench.css?v={{ asset_version }}">
</head>
<body>
{% include "app-nav.html" %}
<main>
  <p class="eyebrow">市场观察</p>
  <h1>指数基金规模观察</h1>
  <p>查看选定基金规模（份额乘单位净值或收盘价）与指数流通市值之比。比例不等于基金实际持股比例。</p>
  <section class="panel fund-observation">
    <div class="fund-field">
      <label for="index-code">选择指数</label>
      <select id="index-code">
          <option value="000300">沪深300</option>
          <option value="000016">上证50</option>
          <option value="000905">中证500</option>
          <option value="000852">中证1000</option>
          <option value="932000">中证2000</option>
          <option value="000510">中证A500</option>
          <option value="399006">创业板指</option>
          <option value="000688">科创50</option>
      </select>
    </div>

    <form id="index-sync">
      <p>选择要统计的基金，最多10只。下方提供部分跟踪该指数的 ETF 示例，支持手动补充。</p>
      <p>最多同步1831个自然日；长区间可能耗时较久。失败后使用相同指数、日期及基金重试，可继续已完成的分区。</p>
      <div class="fund-fields">
        <div class="fund-field fund-full-row">
          <label for="index-numerator">规模口径</label>
          <select id="index-numerator">
            <option value="nav">份额 × 单位净值</option>
          <option value="close">份额 × 不复权收盘价（来源待验证）</option>
          </select>
        </div>
        <div class="fund-field">
          <label for="index-start">开始日期</label>
          <input id="index-start" type="date" required>
        </div>
        <div class="fund-field">
          <label for="index-end">结束日期</label>
          <input id="index-end" type="date" required>
        </div>
        <div class="fund-field fund-full-row">
          <label for="index-funds">基金代码</label>
          <input id="index-funds" placeholder="例如 SSE.510500,SZSE.159922" aria-describedby="index-selected-count" required>
        </div>
        <div class="fund-full-row fund-picker-actions">
          <button id="index-add-examples" class="secondary-button" type="button">添加全部示例</button>
          <button id="index-clear-funds" class="secondary-button" type="button">清空已选</button>
          <span id="index-selected-count" role="status"></span>
        </div>
        <div id="index-examples" class="fund-full-row" role="group" aria-label="点击选择或取消该指数的基金示例" hidden></div>
        <div id="index-selected" class="fund-full-row" role="group" aria-label="已选基金，点击移除"></div>
        <p id="index-sync-hint" class="fund-full-row" hidden>流通市值按当日成分股汇总，使用免费公开数据。成分或估值缺失的日期显示为 —。</p>
        <button id="index-submit" aria-describedby="index-sync-hint" class="primary-button" type="submit">同步所选基金</button>
      </div>
      <p id="index-task" role="status"></p>
      <button id="index-resume" class="secondary-button" type="button" hidden>继续查询同步进度</button>
    </form>

    <fieldset>
      <legend>查看范围（仅本地快照，最近年数截至快照最后交易日）</legend>
      <div class="fund-fields">
        <div class="fund-field fund-full-row">
          <label for="index-range">时间范围</label>
          <select id="index-range">
            <option value="3">最近3年</option>
          <option value="1">最近1年</option>
          <option value="5">最近5年</option>
          <option value="all">完整快照</option>
          <option value="custom">自定义</option>
          </select>
        </div>
        <div class="fund-field">
          <label for="view-start">自定义开始</label>
          <input id="view-start" type="date">
        </div>
        <div class="fund-field">
          <label for="view-end">自定义结束</label>
          <input id="view-end" type="date">
        </div>
        <button id="view-apply" class="secondary-button" type="button">应用查看范围</button>
      </div>
    </fieldset>

    <p id="index-status" role="status">正在读取本地数据…</p>
    <div id="index-result"></div>
  </section>
</main>
<script src="/assets/date-chart.js?v={{ asset_version }}" defer></script>
<script src="/assets/index-funds.js?v={{ asset_version }}" defer></script>
</body>
</html>
