<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 澄明 A 股研究工作台</title>
  <link rel="stylesheet" href="/assets/workbench.css?v={{ version }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="panel login-panel">
      <p class="eyebrow">PRIVATE RESEARCH WORKSPACE</p>
      <h1>进入澄明研究工作台</h1>
      <p class="muted">请输入服务器配置的研究工作台账号和密码。</p>
      {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label class="field"><span>用户名</span><input name="username" autocomplete="username" autofocus required></label>
        <label class="field"><span>密码</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit"><span>安全登录</span><b aria-hidden="true">↗</b></button>
      </form>
      <small>连续输错 5 次后将暂时限制登录。</small>
    </section>
  </main>
</body>
</html>
