name: "改进建议 / Feature request"
description: "说明希望改善的使用场景 / Describe a workflow you want to improve."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "不需要提供真实账户数据。提案不会自动获得实施或合并承诺。 / No private account data is needed; proposals are not implementation commitments."
  - type: textarea
    id: problem
    attributes:
      label: "使用场景和问题 / Use case and problem"
      description: "谁在什么步骤遇到什么困难？ / Who encounters the problem, and at which step?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议行为及验收方式 / Proposed behavior and acceptance criteria"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案与范围边界 / Alternatives and scope"
      description: "可选；是否影响数据口径、策略公式、历史结果、Schema 或联网确认？ / Optional; note data, strategy, history, schema or network-consent impact."
