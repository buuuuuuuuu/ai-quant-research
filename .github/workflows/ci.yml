name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint Python source
        run: uv run ruff check .

      - name: Install Chinese fonts for browser renders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk nginx

      - name: Check HTTP and HTTPS proxy cache and compression
        run: uv run pytest tests/test_nginx_assets.py

      - name: Check market browser interactions and render screenshots
        run: uv run pytest tests/test_market_chart_browser.py
        env:
          AI_QUANT_UI_SCREENSHOT_DIR: ${{ runner.temp }}/market-ui

      - name: Upload market UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-ui-screenshots
          path: ${{ runner.temp }}/market-ui
          if-no-files-found: ignore
          retention-days: 7

      - name: Execute remaining offline tests
        run: uv run pytest --ignore=tests/test_market_chart_browser.py --ignore=tests/test_nginx_assets.py

      - name: Validate browser JavaScript
        run: for script in src/ai_quant_assistant/web/static/*.js; do node --check "$script"; done

      - name: Test stock-pool browser handlers offline
        run: node --test tests/js/*.test.cjs

      - name: Validate deployment shell scripts
        run: for script in deploy/scripts/*.sh; do bash -n "$script"; done

      - name: Validate systemd units
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer

      - name: Build Python wheel
        run: uv build --wheel

      - name: Verify wheel stock workbench contents
        run: uv run python deploy/scripts/check-wheel-contents.py
