<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>股票池研究看板 · 澄明</title><link rel="stylesheet" href="/assets/workbench.css?v={{ asset_version }}"><link rel="stylesheet" href="/assets/research-dashboard.css?v={{ asset_version }}"></head>
<body>{% include "app-nav.html" %}<header class="dashboard-header"><a href="/">澄明 · 研究工作台</a><a href="/#stock-pools">股票池管理</a><a href="/#data-explorer">数据浏览</a><span>{{ username }}</span></header>
<main><p class="eyebrow">LOCAL INCREMENTAL RESEARCH</p><h1>股票池研究看板</h1><p>只读取本地已发布资料。查看、预览、生成和导出简报都不联网，不下载 PDF、不运行 OCR、补齐或研究。</p>
<form id="dashboard-form" class="panel dashboard-form"><label>股票池<select id="dashboard-pool" required></select></label><label>历史 revision<input id="dashboard-revision" type="number" min="1" placeholder="空=当前"></label><label>窗口开始<input id="dashboard-start" type="date"></label><label>截至日期<input id="dashboard-as-of" type="date" required></label><label>复权<select id="dashboard-adjustment"><option value="qfq">前复权 qfq</option><option value="none">不复权 none</option><option value="hfq">后复权 hfq</option></select></label><label>涨跌幅阈值 %<input id="dashboard-change" type="number" min="0" max="30" step="0.1" value="5"></label><label>成交量倍数<input id="dashboard-volume" type="number" min="1" max="20" step="0.1" value="2"></label><label>基准<input id="dashboard-benchmark" maxlength="20" value="csi000300"></label><button type="submit">查看 / 刷新本地看板</button></form>
<p id="dashboard-error" class="negative" role="alert"></p><section id="dashboard-overview" class="panel"></section>
<section class="panel"><h2>股票列表</h2><label>代码或名称筛选 <input id="dashboard-query" maxlength="120"></label><button id="dashboard-search" type="button">筛选</button><div id="dashboard-stocks"></div><button id="dashboard-prev" type="button">上一页</button><span id="dashboard-pages"></span><button id="dashboard-next" type="button">下一页</button></section>
<section class="panel"><h2>本窗口增量事项</h2><div id="dashboard-sections"></div></section>
<section class="panel"><h2>研究简报</h2><p>先预览，再明确生成不可变简报。补齐确认与简报生成相互独立。</p><button id="dashboard-preview" type="button" disabled>预览简报（不保存）</button><button id="dashboard-generate" type="button" disabled>生成不可变简报</button><button id="dashboard-history" type="button">查看历史简报</button><div id="dashboard-brief"></div><div id="dashboard-history-list"></div></section>
</main><script src="/assets/research-dashboard.js?v={{ asset_version }}" defer></script></body></html>
